name: Push backend image

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/push-backend-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: push-backend-image
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: eu-west-1
      ECR_REGISTRY: 950219440008.dkr.ecr.eu-west-1.amazonaws.com
      ECR_REPOSITORY: blaze-backend
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"

          docker build \
            --pull \
            -f backend/BlazeBackend/BlazeBackend/Dockerfile \
            -t "$IMAGE:$IMAGE_TAG" \
            backend/BlazeBackend

          docker tag "$IMAGE:$IMAGE_TAG" "$IMAGE:latest"
          docker push "$IMAGE:$IMAGE_TAG"
          docker push "$IMAGE:latest"
