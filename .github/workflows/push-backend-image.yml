name: Build and deploy backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/push-backend-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: eu-west-1
      ECR_REGISTRY: 950219440008.dkr.ecr.eu-west-1.amazonaws.com
      ECR_REPOSITORY: blaze-backend
      IMAGE_TAG: ${{ github.sha }}
      ECS_CLUSTER: blaze
      ECS_SERVICE: blaze-backend

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build-image
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"

          docker build \
            --pull \
            -f backend/BlazeBackend/BlazeBackend/Dockerfile \
            -t "$IMAGE:$IMAGE_TAG" \
            backend/BlazeBackend

          docker tag "$IMAGE:$IMAGE_TAG" "$IMAGE:latest"
          docker push "$IMAGE:$IMAGE_TAG"
          docker push "$IMAGE:latest"

          echo "image=$IMAGE:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Get current backend task definition
        id: task-definition
        run: |
          TASK_DEFINITION_ARN="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)"

          if [ -z "$TASK_DEFINITION_ARN" ] || [ "$TASK_DEFINITION_ARN" = "None" ]; then
            echo "ECS service $ECS_SERVICE was not found in cluster $ECS_CLUSTER." >&2
            exit 1
          fi

          aws ecs describe-task-definition \
            --task-definition "$TASK_DEFINITION_ARN" \
            --query taskDefinition \
            --output json > "$RUNNER_TEMP/task-definition.json"

          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)' \
            "$RUNNER_TEMP/task-definition.json" > "$RUNNER_TEMP/task-definition-clean.json"

          CONTAINER_NAME="$(jq -r --arg image_prefix "$ECR_REGISTRY/$ECR_REPOSITORY" \
            '[.containerDefinitions[] | select(.image | startswith($image_prefix + ":") or startswith($image_prefix + "@"))][0].name // empty' \
            "$RUNNER_TEMP/task-definition-clean.json")"

          if [ -z "$CONTAINER_NAME" ]; then
            echo "No container image for $ECR_REPOSITORY was found in the current task definition." >&2
            exit 1
          fi

          echo "path=$RUNNER_TEMP/task-definition-clean.json" >> "$GITHUB_OUTPUT"
          echo "container-name=$CONTAINER_NAME" >> "$GITHUB_OUTPUT"

      - name: Render ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.task-definition.outputs.path }}
          container-name: ${{ steps.task-definition.outputs.container-name }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
